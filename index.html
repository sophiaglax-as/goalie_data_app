<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Goalie Data App V2.2</title>
  <style>
    :root{
      --navy:#0b1f44;
      --navy2:#16356f;
      --yellow:#ffd54a;
      --bg:#f4f7fb;
      --white:#fff;
      --line:#d7deea;
      --text:#14213d;
      --muted:#667085;
      --danger:#c62828;
      --ok:#167c3a;
      --card-shadow:0 10px 24px rgba(11,31,68,.08);
    }
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
    }
    body{
      padding:12px 12px 28px;
    }
    .app{
      max-width:520px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .hero{
      background:linear-gradient(135deg,var(--navy),var(--navy2));
      color:#fff;
      border-radius:20px;
      padding:16px;
      box-shadow:var(--card-shadow);
    }
    .hero h1{
      margin:0 0 6px;
      font-size:22px;
    }
    .hero p{
      margin:0;
      font-size:13px;
      opacity:.92;
    }
    .card{
      background:var(--white);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--card-shadow);
      padding:14px;
      overflow:hidden;
    }
    @media (max-width:480px){
      input[type="date"]{
        width:calc(100% - 2px);
        margin-right:2px;
      }
    }
    .tabs{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
    }
    .tabBtn{
      border:none;
      border-radius:12px;
      padding:10px 8px;
      background:#eaf0fa;
      color:var(--navy);
      font-weight:700;
      cursor:pointer;
    }
    .tabBtn.active{
      background:var(--navy);
      color:#fff;
    }
    .tab{
      display:none;
    }
    .tab.active{
      display:block;
    }
    .sectionTitle{
      margin:0 0 10px;
      font-size:16px;
      font-weight:800;
      color:var(--navy);
    }
    .row{
      display:grid;
      gap:10px;
      margin-bottom:10px;
    }
    .row.two{
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .row.two > div{
      min-width:0;
    }
    label{
      display:block;
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:6px;
    }
    input,select,textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      font-size:16px;
      background:#fff;
    }
    input[type="date"]{
      width:100%;
      max-width:100%;
      min-width:0;
      display:block;
      -webkit-appearance:none;
      appearance:none;
      font-size:16px;
      padding:12px 10px;
      text-align:center;
    }
    textarea{
      min-height:84px;
      resize:vertical;
    }
    .btn{
      border:none;
      border-radius:14px;
      padding:12px 14px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }
    .btnPrimary{
      background:var(--navy);
      color:#fff;
    }
    .btnSub{
      background:#eef3fb;
      color:var(--navy);
    }
    .btnDanger{
      background:#fdecec;
      color:var(--danger);
    }
    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      filter:saturate(.55);
      transform:none;
    }
    .btnRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .chips{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .chips.two{
      grid-template-columns:repeat(2,1fr);
    }
    .chip{
      border:1px solid var(--line);
      background:#fff;
      color:var(--navy);
      border-radius:14px;
      padding:12px 8px;
      font-size:15px;
      font-weight:800;
      text-align:center;
      cursor:pointer;
      user-select:none;
    }
    .chip.active{
      background:var(--yellow);
      border-color:#efc62c;
    }
    .status{
      font-size:13px;
      font-weight:700;
      padding:10px 12px;
      border-radius:12px;
      background:#eef3fb;
      color:var(--navy);
    }
    .status.ok{
      background:#edf8f0;
      color:var(--ok);
    }
    .status.ng{
      background:#fdecec;
      color:var(--danger);
    }
    .miniList{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:10px;
    }
    .miniItem{
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
    }
    .miniTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:4px;
    }
    .miniName{
      font-weight:800;
      color:var(--navy);
    }
    .badge{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      background:#eef3fb;
      color:var(--navy);
    }
    .badge.active{
      background:#edf8f0;
      color:var(--ok);
    }
    .badge.inactive{
      background:#f3f4f6;
      color:#667085;
    }
    .grid9{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .gridCell{
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      min-height:68px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      font-weight:900;
      color:var(--navy);
      cursor:pointer;
    }
    .gridCell.active{
      background:var(--yellow);
      border-color:#efc62c;
    }
    .currentBox{
      display:grid;
      gap:8px;
      background:#f8fbff;
      border:1px dashed #bfd0ec;
      border-radius:14px;
      padding:12px;
      margin-bottom:12px;
      font-size:13px;
    }
    .muted{
      color:var(--muted);
      font-size:12px;
    }
    .small{
      font-size:12px;
    }
    @media (max-width:480px){
      .tabs{
        grid-template-columns:repeat(2,1fr);
      }
      .row.two{
        grid-template-columns:1fr;
      }
      .gridCell{
        min-height:60px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <h1>Goalie Data App</h1>
      <p>ゴーリー登録・メニュー登録・セッション作成・4ステップ入力 / V2.2</p>
    </section>

    <section class="card">
      <div class="tabs">
        <button class="tabBtn active" data-tab="inputTab">入力</button>
        <button class="tabBtn" data-tab="sessionTab">セッション</button>
        <button class="tabBtn" data-tab="goalieTab">ゴーリー</button>
        <button class="tabBtn" data-tab="menuTab">メニュー</button>
        <button class="tabBtn" data-tab="dataTab">データ一覧</button>
      </div>
    </section>

    <div id="statusBox" class="status">読み込み中…</div>

    <!-- 入力 -->
    <section id="inputTab" class="card tab active">
      <h2 class="sectionTitle">データ入力</h2>

      <div class="currentBox">
        <div><strong>入力者：</strong><span id="viewInputBy">未設定</span></div>
        <div><strong>日付：</strong><span id="viewDate">未設定</span></div>
        <div><strong>セッション：</strong><span id="viewSession">未選択</span></div>
        <div><strong>ゴーリー：</strong><span id="viewGoalie">未選択</span></div>
      </div>

      <div class="row">
        <div>
          <label for="inputBy">入力者名</label>
          <input id="inputBy" type="text" placeholder="" />
        </div>
      </div>

      <div class="row two">
        <div>
          <label for="dateInput">日付</label>
          <input id="dateInput" type="date" />
        </div>
        <div>
          <label for="sessionSelect">セッション</label>
          <select id="sessionSelect"></select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="goalieSelect">ゴーリー</label>
          <select id="goalieSelect"></select>
        </div>
      </div>

      <div class="row">
        <label>① ゴーリー位置</label>
        <div class="chips" id="goaliePosChips">
          <button class="chip" data-value="L">左</button>
          <button class="chip" data-value="C">中央</button>
          <button class="chip" data-value="R">右</button>
        </div>
      </div>

      <div class="row">
        <label>② シューターエリア</label>
        <div class="chips" id="shooterAreaChips">
          <button class="chip" data-value="5">5</button>
          <button class="chip" data-value="3">3</button>
          <button class="chip" data-value="1">1</button>
          <button class="chip" data-value="6">6</button>
          <button class="chip" data-value="4">4</button>
          <button class="chip" data-value="2">2</button>
        </div>
      </div>

      <div class="row">
        <label>③ 結果</label>
        <div class="chips two" id="resultChips">
          <button class="chip" data-value="goal">成功</button>
          <button class="chip" data-value="save">セーブ</button>
        </div>
      </div>

      <div class="row">
        <label>④ コース（1〜9）</label>
        <div class="grid9" id="courseGrid">
          <button class="gridCell" data-value="1">1</button>
          <button class="gridCell" data-value="2">2</button>
          <button class="gridCell" data-value="3">3</button>
          <button class="gridCell" data-value="4">4</button>
          <button class="gridCell" data-value="5">5</button>
          <button class="gridCell" data-value="6">6</button>
          <button class="gridCell" data-value="7">7</button>
          <button class="gridCell" data-value="8">8</button>
          <button class="gridCell" data-value="9">9</button>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="shotNote">メモ（任意）</label>
          <input id="shotNote" type="text" placeholder="任意メモ" />
        </div>
      </div>

      <div class="btnRow">
        <button id="sendBtn" class="btn btnPrimary">送信</button>
        <button id="undoBtn" class="btn btnDanger">直前取り消し</button>
      </div>

      <div class="miniList" id="recentShots"></div>
    </section>

    <!-- セッション -->
    <section id="sessionTab" class="card tab">
      <h2 class="sectionTitle">セッション作成</h2>

      <div class="row two">
        <div>
          <label for="sessionDate">日付</label>
          <input id="sessionDate" type="date" />
        </div>
        <div>
          <label for="sessionMenu">メニュー</label>
          <select id="sessionMenu"></select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="sessionTitle">セッション名</label>
          <input id="sessionTitle" type="text" placeholder="例：トップ / サブ / 1年生" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="sessionNote">メモ</label>
          <textarea id="sessionNote" placeholder="任意"></textarea>
        </div>
      </div>

      <button id="createSessionBtn" class="btn btnPrimary">セッション作成</button>
      <div class="miniList" id="sessionList"></div>
    </section>

    <!-- ゴーリー -->
    <section id="goalieTab" class="card tab">
      <h2 class="sectionTitle">ゴーリー管理</h2>

      <div class="row">
        <div>
          <label for="goalieName">ゴーリー名</label>
          <input id="goalieName" type="text" placeholder="名前を入力" />
        </div>
      </div>

      <button id="addGoalieBtn" class="btn btnPrimary">追加</button>
      <div class="miniList" id="goalieList"></div>
    </section>

    <!-- メニュー -->
    <section id="menuTab" class="card tab">
      <h2 class="sectionTitle">メニュー管理</h2>

      <div class="row two">
        <div>
          <label for="menuName">メニュー名</label>
          <input id="menuName" type="text" placeholder="例：1on1" />
        </div>
        <div>
          <label for="groupType">種別</label>
          <select id="groupType">
            <option value="対人">対人</option>
            <option value="シュー練">シュー練</option>
          </select>
        </div>
      </div>

      <button id="addMenuBtn" class="btn btnPrimary">追加</button>
      <div class="miniList" id="menuList"></div>
    </section>

    <!-- データ一覧 -->
    <section id="dataTab" class="card tab">
      <h2 class="sectionTitle">データ一覧・削除</h2>
      <div class="row two">
        <div>
          <label for="listFrom">開始日</label>
          <input id="listFrom" type="date" />
        </div>
        <div>
          <label for="listTo">終了日</label>
          <input id="listTo" type="date" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="listGoalie">ゴーリー</label>
          <select id="listGoalie"><option value="">全員</option></select>
        </div>
      </div>
      <button id="searchShotsBtn" class="btn btnPrimary">データを検索</button>
      <div class="muted" style="margin-top:8px;">※2か月より古く圧縮済みのデータは、個別ショットとしては表示・削除できません。</div>
      <div class="miniList" id="shotList"><div class="muted">条件を指定して検索してください</div></div>
    </section>
  </div>

  <script>
    const SERVICE_URL = 'https://script.google.com/macros/s/AKfycbxAcCQtnH-b9ewGXa6gpPuhBJA0PqaHEF3nbIB74GGkj9eVO_P2YBdTkIOGCmJmREtQ/exec';
    const READ_TIMEOUT_MS = 20000;
    const WRITE_TIMEOUT_MS = 20000;

    const state = {
      goalies: [],
      menus: [],
      sessions: [],
      selectedGoaliePos: '',
      selectedShooterArea: '',
      selectedResult: '',
      selectedCourse9: '',
      recentRequestSeq: 0,
      shotListRequestSeq: 0,
      recentInFlightKey: '',
      recentInFlightPromise: null
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(msg, type=''){
      const el = $('statusBox');
      el.textContent = msg;
      el.className = 'status' + (type ? ' ' + type : '');
    }

    function todayStr(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    function daysAgoStr(days){
      const d = new Date();
      d.setDate(d.getDate() - days);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    function apiJsonpOnce(params = {}, timeoutMs = READ_TIMEOUT_MS){
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
        const queryParams = { ...params, callback: callbackName };
        const query = new URLSearchParams(queryParams).toString();
        const script = document.createElement('script');
        script.src = `${SERVICE_URL}?${query}`;

        let done = false;
        let timer = null;

        const cleanup = () => {
          if(done) return;
          done = true;
          if(timer) clearTimeout(timer);
          try { delete window[callbackName]; } catch(e){}
          if(script.parentNode) script.parentNode.removeChild(script);
        };

        window[callbackName] = (data) => {
          if(done) return;
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          if(done) return;
          cleanup();
          reject(new Error('通信に失敗しました'));
        };

        timer = setTimeout(() => {
          if(done) return;
          cleanup();
          const err = new Error('通信がタイムアウトしました');
          err.code = 'TIMEOUT';
          reject(err);
        }, timeoutMs);

        document.body.appendChild(script);
      });
    }

    // GET/JSONP の読み取りだけは1回だけ再試行する。
    // 書き込みは重複登録防止のため自動再試行しない。
    async function apiRead(params = {}){
      try{
        return await apiJsonpOnce(params, READ_TIMEOUT_MS);
      }catch(firstErr){
        await new Promise(r => setTimeout(r, 350));
        return await apiJsonpOnce(params, READ_TIMEOUT_MS);
      }
    }

    async function apiWrite(params = {}){
      return await apiJsonpOnce(params, WRITE_TIMEOUT_MS);
    }

    function setChipGroup(containerId, value){
      const wrap = $(containerId);
      [...wrap.querySelectorAll('[data-value]')].forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === value);
      });
    }

    function bindChipGroup(containerId, onPick){
      const wrap = $(containerId);
      wrap.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-value]');
        if(!btn) return;
        onPick(btn.dataset.value);
      });
    }

    function renderGoalies(){
      const currentGoalieId = $('goalieSelect').value;
      const currentListGoalieId = $('listGoalie').value;
      const activeGoalies = state.goalies.filter(g => String(g.status) === 'active');

      $('goalieSelect').innerHTML = activeGoalies.length
        ? activeGoalies.map(g => `<option value="${escapeHtml(g.goalieId)}">${escapeHtml(g.name)}</option>`).join('')
        : `<option value="">ゴーリー未登録</option>`;

      if(activeGoalies.some(g => String(g.goalieId) === String(currentGoalieId))){
        $('goalieSelect').value = currentGoalieId;
      }

      $('listGoalie').innerHTML =
        `<option value="">全員</option>` +
        state.goalies.map(g => `<option value="${escapeHtml(g.goalieId)}">${escapeHtml(g.name)}</option>`).join('');

      if(state.goalies.some(g => String(g.goalieId) === String(currentListGoalieId))){
        $('listGoalie').value = currentListGoalieId;
      }

      $('goalieList').innerHTML = state.goalies.length ? state.goalies.map(g => `
        <div class="miniItem">
          <div class="miniTop">
            <div class="miniName">${escapeHtml(g.name)}</div>
            <span class="badge ${g.status === 'active' ? 'active' : 'inactive'}">${escapeHtml(g.status)}</span>
          </div>
          <div class="small muted">${escapeHtml(g.goalieId || '')}</div>
          <div style="margin-top:8px;">
            <button class="btn btnSub small" onclick="toggleGoalie('${escapeJs(g.goalieId)}','${g.status === 'active' ? 'inactive' : 'active'}')">
              ${g.status === 'active' ? '非表示にする' : '表示に戻す'}
            </button>
          </div>
        </div>
      `).join('') : `<div class="muted">まだ登録がありません</div>`;

      updateCurrentBox();
    }

    function renderMenus(){
      const currentMenuId = $('sessionMenu').value;
      const activeMenus = state.menus.filter(m => isTruthyActive(m.isActive));

      $('sessionMenu').innerHTML = activeMenus.length
        ? activeMenus.map(m => `<option value="${escapeHtml(m.menuId)}">${escapeHtml(m.menuName)}</option>`).join('')
        : `<option value="">メニュー未登録</option>`;

      if(activeMenus.some(m => String(m.menuId) === String(currentMenuId))){
        $('sessionMenu').value = currentMenuId;
      }

      $('menuList').innerHTML = state.menus.length ? state.menus.map(m => {
        const active = isTruthyActive(m.isActive);
        return `
          <div class="miniItem">
            <div class="miniTop">
              <div class="miniName">${escapeHtml(m.menuName)}</div>
              <span class="badge ${active ? 'active' : 'inactive'}">${active ? 'active' : 'inactive'}</span>
            </div>
            <div class="small muted">${escapeHtml(m.groupType || '')}</div>
            <div style="margin-top:8px;">
              <button type="button" class="btn btnSub small"
                onclick="toggleMenu('${escapeJs(m.menuId)}','${active ? 'false' : 'true'}')">
                ${active ? '非表示にする' : '表示に戻す'}
              </button>
            </div>
          </div>`;
      }).join('') : `<div class="muted">まだ登録がありません</div>`;
    }

    function renderSessions(selectedSessionId = ''){
      const sessions = state.sessions || [];
      const sessionSelect = $('sessionSelect');
      const previousId = sessionSelect.value;

      sessionSelect.innerHTML = sessions.length
        ? sessions.map(s => {
            const menu = state.menus.find(m => String(m.menuId) === String(s.menuId));
            const menuName = menu ? menu.menuName : s.menuId;
            return `<option value="${escapeHtml(s.sessionId)}">${escapeHtml(s.title)} / ${escapeHtml(menuName)}</option>`;
          }).join('')
        : `<option value="">先にセッションを作成してください</option>`;

      if(sessions.length){
        const keepId = selectedSessionId || sessionSelect.dataset.pendingSessionId || previousId || '';
        if(sessions.some(s => String(s.sessionId) === String(keepId))){
          sessionSelect.value = keepId;
        }else{
          sessionSelect.selectedIndex = 0;
        }
      }

      sessionSelect.dataset.pendingSessionId = '';

      $('sessionList').innerHTML = sessions.length
        ? sessions.map(s => {
            const menu = state.menus.find(m => String(m.menuId) === String(s.menuId));
            const menuName = menu ? menu.menuName : s.menuId;
            return `
              <div class="miniItem">
                <div class="miniTop">
                  <div class="miniName">${escapeHtml(s.title)}</div>
                  <span class="badge">${escapeHtml(formatDateValue(s.date))}</span>
                </div>
                <div class="small muted">${escapeHtml(menuName)}</div>
              </div>`;
          }).join('')
        : `<div class="muted">まだセッションがありません</div>`;

      updateCurrentBox();
      // ここでは recent shots を自動取得しない。
      // 呼び出し元が必要なときだけ1回取得する。
    }

    function updateCurrentBox(){
      const inputBy = $('inputBy').value.trim() || '未設定';
      const date = $('dateInput').value || '未設定';

      const sessionId = $('sessionSelect').value;
      const session = state.sessions.find(s => String(s.sessionId) === String(sessionId));
      const sessionText = session ? `${session.title} (${formatDateValue(session.date)})` : '未選択';

      const goalieId = $('goalieSelect').value;
      const goalie = state.goalies.find(g => String(g.goalieId) === String(goalieId));
      const goalieText = goalie ? goalie.name : '未選択';

      $('viewInputBy').textContent = inputBy;
      $('viewDate').textContent = date;
      $('viewSession').textContent = sessionText;
      $('viewGoalie').textContent = goalieText;
    }

    async function loadGoalies(){
      const res = await apiRead({ action:'getGoalies' });
      if(!res.ok) throw new Error(res.error || 'ゴーリー取得に失敗しました');
      state.goalies = res.items || [];
      renderGoalies();
    }

    async function loadMenus(){
      const res = await apiRead({ action:'getMenus' });
      if(!res.ok) throw new Error(res.error || 'メニュー取得に失敗しました');
      state.menus = res.items || [];
      renderMenus();
    }

    async function loadSessions(date='', selectedSessionId = ''){
      const res = await apiRead({ action:'getSessions', date: date || '' });
      if(!res.ok) throw new Error(res.error || 'セッション取得に失敗しました');
      state.sessions = res.items || [];
      renderSessions(selectedSessionId);
      return state.sessions;
    }

    async function loadRecentShots(force=false){
      const sessionId = $('sessionSelect').value;
      if(!sessionId){
        $('recentShots').innerHTML = '<div class="muted">セッションを選択してください</div>';
        return [];
      }

      const key = String(sessionId);
      if(!force && state.recentInFlightPromise && state.recentInFlightKey === key){
        return state.recentInFlightPromise;
      }

      const seq = ++state.recentRequestSeq;
      $('recentShots').innerHTML = '<div class="muted">最近のデータを読み込み中…</div>';

      const promise = (async () => {
        try{
          const res = await apiRead({ action:'getRecentShots', sessionId, limit:10 });
          if(!res.ok) throw new Error(res.error || '最近のデータ取得に失敗しました');

          // 選択セッションが変わった後に古い応答が戻ってきても描画しない。
          if(seq !== state.recentRequestSeq || String($('sessionSelect').value) !== key){
            return res.items || [];
          }

          const items = res.items || [];
          $('recentShots').innerHTML = items.length ? items.map(s => `
            <div class="miniItem">
              <div class="miniTop">
                <div class="miniName">${escapeHtml(resultLabel(s.result))} / ${escapeHtml(s.course9)}</div>
                <span class="badge">${escapeHtml(s.timestamp || '')}</span>
              </div>
              <div class="small muted">
                位置:${escapeHtml(s.goaliePos)} / エリア:${escapeHtml(s.shooterArea)} / 入力:${escapeHtml(s.inputBy || '')}
              </div>
            </div>
          `).join('') : `<div class="muted">まだ入力がありません</div>`;

          return items;
        }catch(err){
          if(seq === state.recentRequestSeq && String($('sessionSelect').value) === key){
            $('recentShots').innerHTML = `<div class="muted">最近のデータを取得できませんでした。必要ならセッションを選び直してください。</div>`;
          }
          throw err;
        }finally{
          if(state.recentInFlightKey === key){
            state.recentInFlightKey = '';
            state.recentInFlightPromise = null;
          }
        }
      })();

      state.recentInFlightKey = key;
      state.recentInFlightPromise = promise;
      return promise;
    }

    async function refreshRecentQuietly(){
      try{
        await loadRecentShots(true);
      }catch(err){
        // 保存・削除・取り消し自体の成功表示を、再読込失敗で上書きしない。
      }
    }

    async function loadShotList(){
      const from = $('listFrom').value;
      const to = $('listTo').value;
      const goalieId = $('listGoalie').value;

      if(from && to && from > to){
        setStatus('開始日は終了日以前にしてください', 'ng');
        return;
      }

      const seq = ++state.shotListRequestSeq;
      $('shotList').innerHTML = '<div class="muted">検索中…</div>';
      setStatus('データを検索しています…');

      const params = { action:'getShotList', limit:300 };
      if(from) params.from = from;
      if(to) params.to = to;
      if(goalieId) params.goalieId = goalieId;

      try{
        const res = await apiRead(params);
        if(!res.ok) throw new Error(res.error || 'データ取得に失敗しました');
        if(seq !== state.shotListRequestSeq) return;

        let items = res.items || [];
        // GAS側が goalieId フィルタを無視する実装でも画面側で保証する。
        if(goalieId){
          items = items.filter(s => String(s.goalieId || '') === String(goalieId));
        }

        renderShotList(items);
        const limitedText = res.scanLimited ? '（検索上限に達しました）' : '';
        setStatus(`${items.length}件表示しました${limitedText}`, 'ok');
      }catch(err){
        if(seq !== state.shotListRequestSeq) return;
        $('shotList').innerHTML = '<div class="muted">取得できませんでした</div>';
        setStatus(err.message || 'データ取得に失敗しました', 'ng');
      }
    }

    function renderShotList(items){
      const wrap = $('shotList');
      if(!items.length){
        wrap.innerHTML = '<div class="muted">該当するデータはありません</div>';
        return;
      }

      wrap.innerHTML = items.map(s => {
        const goalie = state.goalies.find(g => String(g.goalieId) === String(s.goalieId));
        const menu = state.menus.find(m => String(m.menuId) === String(s.menuId));
        const goalieName = goalie ? goalie.name : (s.goalieId || '');
        const menuName = menu ? menu.menuName : (s.menuId || '');
        return `
          <div class="miniItem">
            <div class="miniTop">
              <div class="miniName">${escapeHtml(formatDateValue(s.date))} / ${escapeHtml(goalieName)}</div>
              <span class="badge">${escapeHtml(resultLabel(s.result))}</span>
            </div>
            <div class="small">${escapeHtml(menuName)} / 位置:${escapeHtml(s.goaliePos || '')} / エリア:${escapeHtml(s.shooterArea || '')} / コース:${escapeHtml(s.course9 || '')}</div>
            <div class="small muted" style="margin-top:4px;">入力:${escapeHtml(s.inputBy || '')}${s.note ? ' / メモ:' + escapeHtml(s.note) : ''}</div>
            <div style="margin-top:8px;">
              <button type="button" class="btn btnDanger small"
                onclick="deleteShotFromList('${escapeJs(s.shotId || '')}', this)">このデータを削除</button>
            </div>
          </div>`;
      }).join('');
    }

    async function deleteShotFromList(shotId, button){
      if(!shotId) return;
      if(!confirm('この1件を削除しますか？\n削除したデータは通常の集計には含まれなくなります。')) return;

      const deletedBy = $('inputBy').value.trim();
      if(!deletedBy){
        alert('削除者を記録するため、入力タブで入力者名を入力してください。');
        return;
      }

      if(button){
        button.disabled = true;
        button.textContent = '削除中…';
      }
      setStatus('データを削除しています…');

      try{
        const res = await apiWrite({ action:'deleteShot', shotId, deletedBy });
        if(!res.ok) throw new Error(res.error || '削除に失敗しました');

        setStatus('データを削除しました', 'ok');
        // 成功した書き込みを再読込失敗で「削除失敗」にしない。
        loadShotList().catch(() => {});
        refreshRecentQuietly();
      }catch(err){
        if(err.code === 'TIMEOUT'){
          setStatus('通信が遅れています。削除結果をデータ一覧で再確認してください。', 'ng');
        }else{
          setStatus(err.message || '削除に失敗しました', 'ng');
        }
        if(button){
          button.disabled = false;
          button.textContent = 'このデータを削除';
        }
      }
    }
    window.deleteShotFromList = deleteShotFromList;

    function setButtonBusy(buttonId, busy, busyText, normalText){
      const btn = $(buttonId);
      if(!btn) return;
      btn.disabled = busy;
      btn.textContent = busy ? busyText : normalText;
    }

    async function addGoalie(){
      const name = $('goalieName').value.trim();
      if(!name){
        setStatus('ゴーリー名を入力してください', 'ng');
        return;
      }

      setButtonBusy('addGoalieBtn', true, '追加中…', '追加');
      setStatus('ゴーリーを追加しています…');

      try{
        const res = await apiWrite({ action:'addGoalie', name });
        if(!res.ok) throw new Error(res.error || '追加に失敗しました');
        $('goalieName').value = '';
        setStatus('ゴーリーを追加しました', 'ok');
        loadGoalies().catch(() => {});
      }catch(err){
        setStatus(writeErrorMessage(err, '追加結果'), 'ng');
      }finally{
        setButtonBusy('addGoalieBtn', false, '追加中…', '追加');
      }
    }

    async function toggleGoalie(goalieId, status){
      try{
        setStatus('ゴーリー表示状態を更新しています…');
        const res = await apiWrite({ action:'toggleGoalieStatus', goalieId, status });
        if(!res.ok) throw new Error(res.error || '更新に失敗しました');
        setStatus('ゴーリー表示状態を更新しました', 'ok');
        loadGoalies().catch(() => {});
      }catch(err){
        setStatus(writeErrorMessage(err, '更新結果'), 'ng');
      }
    }
    window.toggleGoalie = toggleGoalie;

    async function addMenu(){
      const menuName = $('menuName').value.trim();
      const groupType = $('groupType').value;
      if(!menuName){
        setStatus('メニュー名を入力してください', 'ng');
        return;
      }

      setButtonBusy('addMenuBtn', true, '追加中…', '追加');
      setStatus('メニューを追加しています…');

      try{
        const res = await apiWrite({ action:'addMenu', menuName, groupType });
        if(!res.ok) throw new Error(res.error || '追加に失敗しました');
        $('menuName').value = '';
        setStatus('メニューを追加しました', 'ok');
        loadMenus().catch(() => {});
      }catch(err){
        setStatus(writeErrorMessage(err, '追加結果'), 'ng');
      }finally{
        setButtonBusy('addMenuBtn', false, '追加中…', '追加');
      }
    }

    async function toggleMenu(menuId, isActive){
      try{
        setStatus('メニュー表示状態を更新しています…');
        const res = await apiWrite({ action:'toggleMenuActive', menuId, isActive });
        if(!res.ok) throw new Error(res.error || '更新に失敗しました');

        setStatus('メニュー表示状態を更新しました', 'ok');
        await loadMenus();
        const currentSessionId = $('sessionSelect').value;
        await loadSessions($('dateInput').value, currentSessionId);
        refreshRecentQuietly();
      }catch(err){
        setStatus(writeErrorMessage(err, '更新結果'), 'ng');
      }
    }
    window.toggleMenu = toggleMenu;

    async function createSession(){
      const date = $('sessionDate').value;
      const menuId = $('sessionMenu').value;
      const title = $('sessionTitle').value.trim();
      const note = $('sessionNote').value.trim();

      if(!date){
        setStatus('日付を入力してください', 'ng');
        return;
      }
      if(!menuId){
        setStatus('メニューを選択してください', 'ng');
        return;
      }
      if(!title){
        setStatus('セッション名を入力してください', 'ng');
        return;
      }

      setButtonBusy('createSessionBtn', true, '作成中…', 'セッション作成');
      setStatus('セッションを作成しています…');

      try{
        const res = await apiWrite({ action:'createSession', date, menuId, title, note });
        if(!res.ok) throw new Error(res.error || '作成に失敗しました');

        $('sessionDate').value = date;
        $('dateInput').value = date;
        $('sessionTitle').value = '';
        $('sessionNote').value = '';

        setStatus('セッションを作成しました', 'ok');

        try{
          await loadSessions(date, res.sessionId || '');
          updateCurrentBox();
          refreshRecentQuietly();
        }catch(refreshErr){
          // セッション作成成功は維持する。
        }
      }catch(err){
        setStatus(writeErrorMessage(err, '作成結果'), 'ng');
      }finally{
        setButtonBusy('createSessionBtn', false, '作成中…', 'セッション作成');
      }
    }

    function resetSteps(){
      state.selectedGoaliePos = '';
      state.selectedShooterArea = '';
      state.selectedResult = '';
      state.selectedCourse9 = '';
      setChipGroup('goaliePosChips', '');
      setChipGroup('shooterAreaChips', '');
      setChipGroup('resultChips', '');
      [...$('courseGrid').querySelectorAll('.gridCell')].forEach(el => el.classList.remove('active'));
      $('shotNote').value = '';
    }

    async function sendShot(){
      const inputBy = $('inputBy').value.trim();
      const date = $('dateInput').value;
      const sessionId = $('sessionSelect').value;
      const session = state.sessions.find(s => String(s.sessionId) === String(sessionId));
      const menuId = session ? session.menuId : '';
      const goalieId = $('goalieSelect').value;
      const note = $('shotNote').value.trim();

      if(!inputBy){ setStatus('入力者名を入力してください', 'ng'); return; }
      if(!date){ setStatus('日付を入力してください', 'ng'); return; }
      if(!sessionId){ setStatus('セッションを選択してください', 'ng'); return; }
      if(!goalieId){ setStatus('ゴーリーを選択してください', 'ng'); return; }
      if(!state.selectedGoaliePos){ setStatus('ゴーリー位置を選択してください', 'ng'); return; }
      if(!state.selectedShooterArea){ setStatus('シューターエリアを選択してください', 'ng'); return; }
      if(!state.selectedResult){ setStatus('結果を選択してください', 'ng'); return; }
      if(!state.selectedCourse9){ setStatus('コースを選択してください', 'ng'); return; }

      setButtonBusy('sendBtn', true, '送信中…', '送信');
      setStatus('送信しています…');

      try{
        const res = await apiWrite({
          action:'addShot',
          date,
          sessionId,
          menuId,
          goalieId,
          goaliePos: state.selectedGoaliePos,
          shooterArea: state.selectedShooterArea,
          result: state.selectedResult,
          course9: state.selectedCourse9,
          inputBy,
          note
        });

        if(!res.ok) throw new Error(res.error || '送信に失敗しました');

        // 保存成功を先に確定。再読込は別処理。
        resetSteps();
        setStatus(`送信OK${res.shotId ? `（${res.shotId}）` : ''}`, 'ok');
        refreshRecentQuietly();
      }catch(err){
        if(err.code === 'TIMEOUT'){
          setStatus('通信が遅れています。二重送信せず、最近のデータまたはデータ一覧で保存結果を確認してください。', 'ng');
        }else{
          setStatus(err.message || '送信に失敗しました', 'ng');
        }
      }finally{
        setButtonBusy('sendBtn', false, '送信中…', '送信');
      }
    }

    async function undoLast(){
      const sessionId = $('sessionSelect').value;
      const inputBy = $('inputBy').value.trim();

      if(!sessionId){
        setStatus('セッションを選択してください', 'ng');
        return;
      }
      if(!inputBy){
        setStatus('取り消し者を記録するため、入力者名を入力してください', 'ng');
        return;
      }

      setButtonBusy('undoBtn', true, '取り消し中…', '直前取り消し');
      setStatus('直前データを取り消しています…');

      try{
        const res = await apiWrite({
          action:'undoLastShot',
          sessionId,
          deletedBy: inputBy
        });
        if(!res.ok) throw new Error(res.error || '取り消しに失敗しました');

        setStatus('直前データを取り消しました', 'ok');
        refreshRecentQuietly();
      }catch(err){
        if(err.code === 'TIMEOUT'){
          setStatus('通信が遅れています。二重に取り消さず、最近のデータで結果を確認してください。', 'ng');
        }else{
          setStatus(err.message || '取り消しに失敗しました', 'ng');
        }
      }finally{
        setButtonBusy('undoBtn', false, '取り消し中…', '直前取り消し');
      }
    }

    async function searchShotList(){
      setButtonBusy('searchShotsBtn', true, '検索中…', 'データを検索');
      try{
        await loadShotList();
      }finally{
        setButtonBusy('searchShotsBtn', false, '検索中…', 'データを検索');
      }
    }

    function resultLabel(result){
      if(result === 'save') return 'セーブ';
      if(result === 'goal') return '成功';
      return result || '';
    }

    function formatDateValue(value){
      if(!value) return '';
      const s = String(value);
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[1]}-${m[2]}-${m[3]}`;
      return s;
    }

    function writeErrorMessage(err, what='処理結果'){
      if(err && err.code === 'TIMEOUT'){
        return `通信が遅れています。${what}を再確認してください。`;
      }
      return (err && err.message) ? err.message : '処理に失敗しました';
    }

    function escapeHtml(str){
      return String(str ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#39;");
    }

    function escapeJs(str){
      return String(str ?? '')
        .replaceAll('\\','\\\\')
        .replaceAll("'","\\'")
        .replaceAll('\n','\\n')
        .replaceAll('\r','\\r');
    }

    function isTruthyActive(v){
      const s = String(v ?? '').trim().toLowerCase();
      return s === 'true' || s === 'active' || s === '1' || s === 'yes';
    }

    function bindTabs(){
      document.querySelectorAll('.tabBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tabBtn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          $(btn.dataset.tab).classList.add('active');
        });
      });
    }

    function bindEvents(){
      bindChipGroup('goaliePosChips', (v) => {
        state.selectedGoaliePos = v;
        setChipGroup('goaliePosChips', v);
      });

      bindChipGroup('shooterAreaChips', (v) => {
        state.selectedShooterArea = v;
        setChipGroup('shooterAreaChips', v);
      });

      bindChipGroup('resultChips', (v) => {
        state.selectedResult = v;
        setChipGroup('resultChips', v);
      });

      $('courseGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('.gridCell');
        if(!btn) return;
        state.selectedCourse9 = btn.dataset.value;
        [...$('courseGrid').querySelectorAll('.gridCell')].forEach(el => {
          el.classList.toggle('active', el.dataset.value === state.selectedCourse9);
        });
      });

      $('addGoalieBtn').addEventListener('click', addGoalie);
      $('addMenuBtn').addEventListener('click', addMenu);
      $('createSessionBtn').addEventListener('click', createSession);
      $('sendBtn').addEventListener('click', sendShot);
      $('undoBtn').addEventListener('click', undoLast);
      $('searchShotsBtn').addEventListener('click', searchShotList);

      $('dateInput').addEventListener('change', async () => {
        updateCurrentBox();
        $('recentShots').innerHTML = '<div class="muted">セッションを読み込み中…</div>';
        try{
          await loadSessions($('dateInput').value);
          updateCurrentBox();
          await loadRecentShots(true);
        }catch(err){
          $('recentShots').innerHTML = '<div class="muted">読み込みに失敗しました</div>';
          setStatus(err.message || '読み込みに失敗しました', 'ng');
        }
      });

      $('sessionSelect').addEventListener('change', async () => {
        updateCurrentBox();
        try{
          await loadRecentShots(true);
        }catch(err){
          setStatus(err.message || '最近のデータ取得に失敗しました', 'ng');
        }
      });

      $('goalieSelect').addEventListener('change', updateCurrentBox);
      $('inputBy').addEventListener('input', updateCurrentBox);

      $('sessionDate').addEventListener('change', () => {
        if(!$('dateInput').value) $('dateInput').value = $('sessionDate').value;
      });
    }

    async function init(){
      bindTabs();
      bindEvents();

      const today = todayStr();
      $('dateInput').value = today;
      $('sessionDate').value = today;

      // データ一覧は当日のデータを探しやすいよう、初期範囲を今日にする。
      $('listFrom').value = today;
      $('listTo').value = today;

      try{
        setStatus('初期読み込み中…');

        const ping = await apiRead({ action:'ping' });
        if(!ping.ok) throw new Error(ping.error || 'API接続に失敗しました');

        // 独立したマスタ読み込みは並列化して初期表示を短縮。
        await Promise.all([loadGoalies(), loadMenus()]);
        await loadSessions(today, '');
        updateCurrentBox();

        // 最近のデータは1回だけ取得。失敗してもアプリ全体の初期化失敗にはしない。
        try{
          await loadRecentShots(true);
        }catch(err){}

        setStatus('準備完了', 'ok');
      }catch(err){
        setStatus(err.message || '初期化に失敗しました', 'ng');
      }
    }

    init();
  </script>
</body>
</html>
